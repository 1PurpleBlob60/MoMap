<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MoMap</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --panel:#ffffffee; --ink:#18231f; --muted:#6b7a73; --line:#e3e8e5; --accent:#1f6f5c; --danger:#c0392b;
    --shadow:0 8px 30px rgba(0,0,0,.18);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --panel:#161d1aee; --ink:#eaf1ed; --muted:#9baba3; --line:#2d3a34; --accent:#5cc7aa; --danger:#ef8577; --shadow:0 8px 30px rgba(0,0,0,.5); }
  }
  :root[data-theme="dark"] { --panel:#161d1aee; --ink:#eaf1ed; --muted:#9baba3; --line:#2d3a34; --accent:#5cc7aa; --danger:#ef8577; --shadow:0 8px 30px rgba(0,0,0,.5); }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); }
  #map { position: fixed; inset: 0; }

  /* floating panel */
  aside {
    position: fixed; z-index: 1000; top: 16px; left: 16px; bottom: 16px; width: 290px;
    display: flex; flex-direction: column; overflow: hidden;
    background: var(--panel); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow);
  }
  header { padding: 18px 18px 12px; }
  .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  h1 { font-size: 1.3rem; margin: 0; letter-spacing: -.01em; }
  h1 span { color: var(--accent); }
  #theme { font-size: 1rem; line-height: 1; padding: 6px 9px; border-radius: 10px; }
  header p { margin: 0; font-size: .82rem; color: var(--muted); line-height: 1.45; }
  .count { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 0 18px 8px; }
  ul { list-style: none; margin: 0; padding: 0 8px; overflow-y: auto; flex: 1; }
  li { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px; cursor: pointer; }
  li:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  li .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
  li .txt { flex: 1; min-width: 0; }
  li b { display: block; font-weight: 600; font-size: .9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li small { color: var(--muted); font-size: .72rem; }
  .empty { padding: 18px 12px; color: var(--muted); font-size: .88rem; cursor: default; }
  .empty:hover { background: none; }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--ink); padding: 4px 10px; }
  button:hover { border-color: var(--accent); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .x { border: 0; color: var(--muted); font-size: 1.1rem; line-height: 1; padding: 4px 8px; }
  .x:hover { color: var(--danger); }
  footer { padding: 12px 14px 14px; border-top: 1px solid var(--line); }
  .tools { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .tools button { padding: 7px 8px; font-size: .85rem; }
  #clear { width: 100%; color: var(--danger); padding: 7px; font-size: .85rem; }

  /* custom pin */
  .pin-wrap { background: none; border: 0; }
  .pin {
    width: 30px; height: 30px; background: var(--c);
    border-radius: 50% 50% 50% 0; transform: rotate(-45deg);
    border: 3px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,.4);
    display: grid; place-items: center; transition: transform .15s;
    animation: drop .35s cubic-bezier(.3,1.5,.5,1);
  }
  .pin::after { content: ""; width: 9px; height: 9px; border-radius: 50%; background: #fff; }
  .pin-wrap:hover .pin { transform: rotate(-45deg) scale(1.12); }
  @keyframes drop {
    from { transform: translateY(-26px) rotate(-45deg); opacity: 0; }
    to   { transform: translateY(0) rotate(-45deg); opacity: 1; }
  }

  /* popup + tooltip */
  .leaflet-popup-content-wrapper { border-radius: 14px; box-shadow: var(--shadow); }
  .leaflet-tooltip { border-radius: 8px; border: 0; box-shadow: var(--shadow); font-weight: 600; padding: 4px 9px; }
  .popup { min-width: 190px; color: #18231f; }
  .popup input { width: 100%; padding: 8px 10px; margin: 2px 0 10px; border: 1px solid #cfd8d3; border-radius: 8px; font: inherit; }
  .swatches { display: flex; gap: 8px; margin-bottom: 12px; }
  .sw { width: 22px; height: 22px; padding: 0; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 1px #cfd8d3; background: var(--c); }
  .sw.on { box-shadow: 0 0 0 2px #18231f; }
  .popup .row { display: flex; gap: 8px; }
  .popup .row button { flex: 1; color: #18231f; border-color: #cfd8d3; padding: 6px; }
  .popup .row .primary { background: #1f6f5c; border-color: #1f6f5c; color: #fff; }
  .popup .row .danger { color: #c0392b; }

  /* map controls follow theme */
  .leaflet-control-layers, .leaflet-bar a {
    background: var(--panel); color: var(--ink); border-color: var(--line);
  }
  .leaflet-control-layers { border-radius: 12px; border: 0; box-shadow: var(--shadow); }
  .leaflet-bar { border: 0; box-shadow: var(--shadow); border-radius: 12px; overflow: hidden; }
  .leaflet-bar a:hover { background: var(--line); }

  /* toast */
  #toast {
    position: fixed; z-index: 2000; left: 50%; bottom: 24px; transform: translate(-50%, 20px);
    background: #18231f; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: .9rem;
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; box-shadow: var(--shadow);
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 700px) {
    aside { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; height: 44%; }
    header p { display: none; }
    #toast { bottom: calc(44% + 20px); }
  }
</style>
</head>
<body>
<div id="map"></div>
<aside>
  <header>
    <div class="top">
      <h1>Mo<span>Map</span></h1>
      <button id="theme" aria-label="Switch light or dark mode"></button>
    </div>
    <p>Tap the map to drop a pin. Drag to move it. Saved in your browser.</p>
  </header>
  <div class="count" id="count"></div>
  <ul id="list"></ul>
  <footer>
    <div class="tools">
      <button id="fit">Fit all</button>
      <button id="share">Share link</button>
      <button id="export">Export</button>
      <button id="import">Import</button>
    </div>
    <button id="clear">Remove all pins</button>
    <input type="file" id="file" accept=".geojson,.json,application/geo+json,application/json" hidden>
  </footer>
</aside>
<div id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
  const STORAGE_KEY = "my-map-markers";
  const LAYER_KEY = "momap-layer";
  const THEME_KEY = "momap-theme";
  const COLORS = ["#1f6f5c", "#e5534b", "#e8a317", "#3b7dd8", "#8e5bd1"];

  /* ---------- toast ---------- */
  const toastEl = document.getElementById("toast");
  let toastTimer;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2400);
  }

  /* ---------- theme ---------- */
  const themeBtn = document.getElementById("theme");
  function effectiveTheme() {
    try { const t = localStorage.getItem(THEME_KEY); if (t) return t; } catch (e) {}
    return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  function applyTheme(t) {
    document.documentElement.dataset.theme = t;
    themeBtn.textContent = t === "dark" ? "\u2600" : "\u263E";
    if (typeof currentBase !== "undefined" && (currentBase === "Light" || currentBase === "Dark")) {
      setBase(t === "dark" ? "Dark" : "Light");
    }
  }
  themeBtn.onclick = () => {
    const next = effectiveTheme() === "dark" ? "light" : "dark";
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
    applyTheme(next);
  };
  const startTheme = effectiveTheme();
  document.documentElement.dataset.theme = startTheme;
  themeBtn.textContent = startTheme === "dark" ? "\u2600" : "\u263E";

  /* ---------- map ---------- */
  const map = L.map("map", {
    zoomControl: false, maxZoom: 19,
    wheelPxPerZoomLevel: 40,   // faster mouse-wheel zoom
    zoomSnap: 0.5, zoomDelta: 1
  }).setView([63.4305, 10.3951], 12); // Trondheim
  L.control.zoom({ position: "topright" }).addTo(map);

  // Free map styles, no API key needed
  const esri = "https://server.arcgisonline.com/ArcGIS/rest/services/";
  const baseLayers = {
    "Light": L.tileLayer(esri + "Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}", {
      maxZoom: 19, maxNativeZoom: 16, attribution: "Tiles &copy; Esri"
    }),
    "Dark": L.tileLayer(esri + "Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}", {
      maxZoom: 19, maxNativeZoom: 16, attribution: "Tiles &copy; Esri"
    }),
    "Streets": L.tileLayer(esri + "World_Street_Map/MapServer/tile/{z}/{y}/{x}", {
      maxZoom: 19, attribution: "Tiles &copy; Esri"
    }),
    "OpenStreetMap": L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }),
    "Satellite": L.tileLayer(esri + "World_Imagery/MapServer/tile/{z}/{y}/{x}", {
      maxZoom: 19, attribution: "Tiles &copy; Esri"
    }),
    "Terrain": L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png", {
      maxZoom: 19, maxNativeZoom: 17, subdomains: "abc",
      attribution: 'Map data &copy; OpenStreetMap contributors, SRTM | Style &copy; <a href="https://opentopomap.org">OpenTopoMap</a>'
    })
  };

  let currentBase = startTheme === "dark" ? "Dark" : "Light";
  try {
    const saved = localStorage.getItem(LAYER_KEY);
    if (saved && saved !== "Light" && saved !== "Dark" && baseLayers[saved]) currentBase = saved;
  } catch (e) {}
  baseLayers[currentBase].addTo(map);
  L.control.layers(baseLayers, null, { position: "topright" }).addTo(map);

  function setBase(name) {
    const target = baseLayers[name];
    if (!target) return;
    Object.values(baseLayers).forEach(l => { if (l !== target && map.hasLayer(l)) map.removeLayer(l); });
    if (!map.hasLayer(target)) target.addTo(map);
  }
  map.on("baselayerchange", e => {
    currentBase = e.name;
    try { localStorage.setItem(LAYER_KEY, e.name); } catch (err) {}
  });

  /* ---------- pins ---------- */
  function makeIcon(color) {
    return L.divIcon({
      className: "pin-wrap",
      html: '<div class="pin" style="--c:' + color + '"></div>',
      iconSize: [30, 30], iconAnchor: [15, 38], popupAnchor: [0, -38]
    });
  }

  let markers = []; // { id, name, lat, lng, color, layer }

  function save() {
    const data = markers.map(({ id, name, lat, lng, color }) => ({ id, name, lat, lng, color }));
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
  }

  function popupContent(m) {
    const div = document.createElement("div");
    div.className = "popup";
    const input = document.createElement("input");
    input.value = m.name;
    input.placeholder = "Name this place";
    input.setAttribute("aria-label", "Pin name");

    const sw = document.createElement("div");
    sw.className = "swatches";
    COLORS.forEach(c => {
      const b = document.createElement("button");
      b.className = "sw" + (c === m.color ? " on" : "");
      b.style.setProperty("--c", c);
      b.setAttribute("aria-label", "Color " + c);
      b.onclick = () => {
        m.color = c;
        m.layer.setIcon(makeIcon(c));
        sw.querySelectorAll(".sw").forEach(x => x.classList.remove("on"));
        b.classList.add("on");
        render(); save();
      };
      sw.append(b);
    });

    const row = document.createElement("div");
    row.className = "row";
    const saveBtn = document.createElement("button");
    saveBtn.className = "primary"; saveBtn.textContent = "Save";
    const delBtn = document.createElement("button");
    delBtn.className = "danger"; delBtn.textContent = "Delete";
    row.append(saveBtn, delBtn);
    div.append(input, sw, row);

    const rename = () => { m.name = input.value.trim() || "Untitled"; m.layer.closePopup(); render(); save(); };
    saveBtn.onclick = rename;
    input.onkeydown = e => { if (e.key === "Enter") rename(); };
    delBtn.onclick = () => removeMarker(m.id);
    return div;
  }

  function addMarker(lat, lng, name = "Untitled", id = Date.now() + Math.random(), open = false, color) {
    color = color || COLORS[markers.length % COLORS.length];
    const m = { id, name, lat, lng, color };
    m.layer = L.marker([lat, lng], { draggable: true, icon: makeIcon(color) }).addTo(map);
    m.layer.bindPopup(() => popupContent(m));
    m.layer.bindTooltip(() => m.name, { direction: "top", offset: [0, -36] });
    m.layer.on("dragend", () => { const p = m.layer.getLatLng(); m.lat = p.lat; m.lng = p.lng; render(); save(); });
    markers.push(m);
    render(); save();
    if (open) m.layer.openPopup();
    return m;
  }

  function removeMarker(id) {
    const m = markers.find(x => x.id === id);
    if (!m) return;
    map.removeLayer(m.layer);
    markers = markers.filter(x => x.id !== id);
    render(); save();
  }

  function goTo(m) {
    map.flyTo([m.lat, m.lng], Math.max(map.getZoom(), 16), { duration: 0.5 });
    map.once("moveend", () => m.layer.openPopup());
  }

  function fitAll() {
    if (!markers.length) { toast("No pins yet"); return; }
    const wide = innerWidth > 700;
    map.flyToBounds(L.latLngBounds(markers.map(m => [m.lat, m.lng])), {
      paddingTopLeft: wide ? [330, 60] : [40, 60],
      paddingBottomRight: [60, wide ? 60 : Math.round(innerHeight * 0.45)],
      maxZoom: 16, duration: 0.6
    });
  }

  function render() {
    const list = document.getElementById("list");
    document.getElementById("count").textContent = markers.length + (markers.length === 1 ? " pin" : " pins");
    list.innerHTML = "";
    if (!markers.length) {
      list.innerHTML = '<li class="empty">No pins yet. Click the map to add one.</li>';
      return;
    }
    markers.forEach(m => {
      const li = document.createElement("li");
      const dot = document.createElement("span");
      dot.className = "dot"; dot.style.background = m.color;
      const txt = document.createElement("div");
      txt.className = "txt";
      const name = document.createElement("b");
      name.textContent = m.name;
      const coords = document.createElement("small");
      coords.textContent = m.lat.toFixed(4) + ", " + m.lng.toFixed(4);
      txt.append(name, coords);
      const del = document.createElement("button");
      del.className = "x"; del.textContent = "\u00d7"; del.setAttribute("aria-label", "Delete " + m.name);
      del.onclick = e => { e.stopPropagation(); removeMarker(m.id); };
      li.append(dot, txt, del);
      li.onclick = () => goTo(m);
      list.append(li);
    });
  }

  /* ---------- share / export / import ---------- */
  function b64e(str) {
    let bin = "";
    new TextEncoder().encode(str).forEach(b => bin += String.fromCharCode(b));
    return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  function b64d(s) {
    s = s.replace(/-/g, "+").replace(/_/g, "/");
    while (s.length % 4) s += "=";
    return new TextDecoder().decode(Uint8Array.from(atob(s), c => c.charCodeAt(0)));
  }

  // rows: [lat, lng, name, color]
  function importPins(rows) {
    let added = 0;
    rows.forEach(r => {
      const lat = Number(r[0]), lng = Number(r[1]);
      if (!isFinite(lat) || !isFinite(lng) || Math.abs(lat) > 90 || Math.abs(lng) > 180) return;
      const name = String(r[2] || "Untitled").slice(0, 100);
      const dupe = markers.some(m => Math.abs(m.lat - lat) < 1e-5 && Math.abs(m.lng - lng) < 1e-5 && m.name === name);
      if (dupe) return;
      addMarker(lat, lng, name, undefined, false, COLORS.includes(r[3]) ? r[3] : undefined);
      added++;
    });
    return added;
  }

  document.getElementById("fit").onclick = fitAll;

  document.getElementById("share").onclick = async () => {
    if (!markers.length) { toast("No pins to share"); return; }
    const rows = markers.map(m => [+m.lat.toFixed(5), +m.lng.toFixed(5), m.name, m.color]);
    const link = location.href.split("#")[0] + "#share=" + b64e(JSON.stringify(rows));
    try { await navigator.clipboard.writeText(link); toast("Link copied. Send it to anyone."); }
    catch (e) { prompt("Copy this link:", link); }
  };

  document.getElementById("export").onclick = () => {
    if (!markers.length) { toast("No pins to export"); return; }
    const geo = {
      type: "FeatureCollection",
      features: markers.map(m => ({
        type: "Feature",
        properties: { name: m.name, color: m.color },
        geometry: { type: "Point", coordinates: [m.lng, m.lat] }
      }))
    };
    const url = URL.createObjectURL(new Blob([JSON.stringify(geo, null, 2)], { type: "application/geo+json" }));
    const a = document.createElement("a");
    a.href = url; a.download = "momap-pins.geojson";
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast("Exported " + markers.length + " pins");
  };

  const fileInput = document.getElementById("file");
  document.getElementById("import").onclick = () => fileInput.click();
  fileInput.onchange = async () => {
    const f = fileInput.files[0];
    fileInput.value = "";
    if (!f) return;
    try {
      const geo = JSON.parse(await f.text());
      const rows = (geo.features || [])
        .filter(x => x.geometry && x.geometry.type === "Point")
        .map(x => [x.geometry.coordinates[1], x.geometry.coordinates[0], x.properties && x.properties.name, x.properties && x.properties.color]);
      const n = importPins(rows);
      toast(n ? "Imported " + n + " pins" : "No new pins found");
      if (n) fitAll();
    } catch (e) { toast("Could not read that file"); }
  };

  /* ---------- events + startup ---------- */
  map.on("click", e => addMarker(e.latlng.lat, e.latlng.lng, "Untitled", undefined, true));

  document.getElementById("clear").onclick = () => {
    if (markers.length && confirm("Remove all pins?")) [...markers].forEach(m => removeMarker(m.id));
  };

  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    saved.forEach(s => addMarker(s.lat, s.lng, s.name, s.id, false, s.color));
  } catch (e) {}

  if (location.hash.startsWith("#share=")) {
    try {
      const n = importPins(JSON.parse(b64d(location.hash.slice(7))));
      history.replaceState(null, "", location.href.split("#")[0]);
      toast(n ? "Loaded " + n + " shared pins" : "Shared pins already on your map");
      if (n) setTimeout(fitAll, 300);
    } catch (e) { toast("That share link is broken"); }
  }
  render();
</script>
</body>
</html>
